<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMax meet">
  <style>
    .headlight-left { animation: rgbHL 6s ease-in-out infinite; }
    .headlight-right { animation: rgbHR 6s ease-in-out infinite; }
    .headlight-aura-left { animation: rgbAuraL 6s ease-in-out infinite; }
    .headlight-aura-right { animation: rgbAuraR 6s ease-in-out infinite; }
    .headlight-glow-left { animation: rgbGlowL 6s ease-in-out infinite; }
    .headlight-glow-right { animation: rgbGlowR 6s ease-in-out infinite; }
    @keyframes rgbHL {
      0%   { fill: #ff006e; }
      20%  { fill: #8338ec; }
      40%  { fill: #3a86ff; }
      60%  { fill: #06d6a0; }
      80%  { fill: #ffbe0b; }
      100% { fill: #ff006e; }
    }
    @keyframes rgbHR {
      0%   { fill: #3a86ff; }
      20%  { fill: #06d6a0; }
      40%  { fill: #ffbe0b; }
      60%  { fill: #ff006e; }
      80%  { fill: #8338ec; }
      100% { fill: #3a86ff; }
    }
    @keyframes rgbAuraL {
      0%   { fill: #ff006e; opacity: 0.04; }
      25%  { fill: #8338ec; opacity: 0.08; }
      50%  { fill: #3a86ff; opacity: 0.04; }
      75%  { fill: #06d6a0; opacity: 0.08; }
      100% { fill: #ff006e; opacity: 0.04; }
    }
    @keyframes rgbAuraR {
      0%   { fill: #3a86ff; opacity: 0.04; }
      25%  { fill: #06d6a0; opacity: 0.08; }
      50%  { fill: #ffbe0b; opacity: 0.04; }
      75%  { fill: #ff006e; opacity: 0.08; }
      100% { fill: #3a86ff; opacity: 0.04; }
    }
    @keyframes rgbGlowL {
      0%   { stroke: #ff006e; }
      25%  { stroke: #8338ec; }
      50%  { stroke: #3a86ff; }
      75%  { stroke: #06d6a0; }
      100% { stroke: #ff006e; }
    }
    @keyframes rgbGlowR {
      0%   { stroke: #3a86ff; }
      25%  { stroke: #06d6a0; }
      50%  { stroke: #ffbe0b; }
      75%  { stroke: #ff006e; }
      100% { stroke: #3a86ff; }
    }
    @media (prefers-reduced-motion: reduce) {
      .headlight-left, .headlight-right, .headlight-aura-left,
      .headlight-aura-right, .headlight-glow-left, .headlight-glow-right { animation: none; }
    }
  </style>
  <!-- Dodge Charger Front View Silhouette -->
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1c24;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#252830;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#121319;stop-opacity:0.95"/>
    </linearGradient>
    <radialGradient id="headlightL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="headlightR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3a86ff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#3a86ff;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="hoodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2c34;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#1a1c24;stop-opacity:0.5"/>
    </linearGradient>
  </defs>

  <!-- Car Body Outline -->
  <path d="M 100 440
    L 120 380
    Q 130 340 160 320
    L 180 300
    Q 200 280 240 275
    L 280 270
    Q 300 255 340 252
    L 460 252
    Q 500 255 520 270
    L 560 275
    Q 600 280 620 300
    L 640 320
    Q 670 340 680 380
    L 700 440
    Z" 
    fill="url(#bodyGrad)" stroke="#3a3c44" stroke-width="1.5" opacity="0.85"/>

  <!-- Hood -->
  <path d="M 180 300
    Q 200 280 240 275
    L 280 270
    Q 300 255 340 252
    L 460 252
    Q 500 255 520 270
    L 560 275
    Q 600 280 620 300
    L 610 340
    L 190 340
    Z" 
    fill="url(#hoodGrad)" opacity="0.6"/>

  <!-- Hood Lines -->
  <line x1="300" y1="255" x2="300" y2="335" stroke="#3a3c44" stroke-width="1" opacity="0.3"/>
  <line x1="500" y1="255" x2="500" y2="335" stroke="#3a3c44" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="252" x2="400" y2="335" stroke="#3a3c44" stroke-width="1.5" opacity="0.2"/>

  <!-- Grille (Dodge Crosshair Style) -->
  <rect x="320" y="340" width="160" height="70" rx="4" fill="#0a0b0e" stroke="#3a3c44" stroke-width="1.5" opacity="0.8"/>
  <!-- Crosshair -->
  <line x1="400" y1="345" x2="400" y2="405" stroke="#4a4c54" stroke-width="2" opacity="0.4"/>
  <circle cx="400" cy="375" r="22" fill="none" stroke="#4a4c54" stroke-width="2" opacity="0.3"/>
  <circle cx="400" cy="375" r="14" fill="none" stroke="#4a4c54" stroke-width="1.5" opacity="0.25"/>
  <!-- SRT Badge -->
  <text x="400" y="380" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#e8002c" opacity="0.5">SRT</text>

  <!-- Left Headlight -->
  <path d="M 190 310 L 270 310 L 275 340 L 195 340 Z" fill="#1a1c24" stroke="#3a3c44" stroke-width="1" opacity="0.8"/>
  <ellipse cx="232" cy="325" rx="40" ry="12" fill="url(#headlightL)" class="headlight-left"/>
  <rect x="195" y="315" width="78" height="18" rx="3" fill="none" stroke="#ff006e" stroke-width="0.5" opacity="0.3" class="headlight-glow-left"/>

  <!-- Right Headlight -->
  <path d="M 530 310 L 610 310 L 605 340 L 525 340 Z" fill="#1a1c24" stroke="#3a3c44" stroke-width="1" opacity="0.8"/>
  <ellipse cx="568" cy="325" rx="40" ry="12" fill="url(#headlightR)" class="headlight-right"/>
  <rect x="527" y="315" width="78" height="18" rx="3" fill="none" stroke="#3a86ff" stroke-width="0.5" opacity="0.3" class="headlight-glow-right"/>

  <!-- Lower Bumper -->
  <path d="M 160 410 L 640 410 L 660 440 L 140 440 Z" fill="#0e0f14" stroke="#2a2c34" stroke-width="1" opacity="0.7"/>

  <!-- Lower Air Intakes -->
  <rect x="200" y="415" width="80" height="20" rx="3" fill="#06070a" opacity="0.6"/>
  <rect x="520" y="415" width="80" height="20" rx="3" fill="#06070a" opacity="0.6"/>

  <!-- Wheels Hint -->
  <ellipse cx="140" cy="440" rx="30" ry="8" fill="#0a0b0e" opacity="0.5"/>
  <ellipse cx="660" cy="440" rx="30" ry="8" fill="#0a0b0e" opacity="0.5"/>

  <!-- Headlight Glow Effects -->
  <ellipse cx="232" cy="325" rx="55" ry="18" fill="#ff006e" opacity="0.06" class="headlight-aura-left"/>
  <ellipse cx="568" cy="325" rx="55" ry="18" fill="#3a86ff" opacity="0.06" class="headlight-aura-right"/>
</svg>